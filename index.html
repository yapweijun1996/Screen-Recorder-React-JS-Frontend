<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Professional screen recording and video editing in your browser" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>ScreenClip Pro</title>
    <style>
      /* Prevent flash of wrong theme */
      html:not(.dark) body { background-color: #f8fafc; color: #0f172a; }
      html.dark body { background-color: #0f172a; color: #f8fafc; }
    </style>
    <script>
      // Apply saved theme before first paint to prevent flash
      (function() {
        var t = localStorage.getItem('screenclip.theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
        else if (t === 'dark') document.documentElement.classList.add('dark');
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.classList.remove('dark');
      })();
    </script>
