    <title>ScreenClip Pro</title>
    <style>
      /* Prevent flash of wrong theme */
      html:not(.dark) body { background-color: #f8fafc; color: #0f172a; }
      html.dark body { background-color: #0f172a; color: #f8fafc; }
    </style>
    <script>
      // Apply saved theme before first paint to prevent flash
      (function() {
        var t = localStorage.getItem('screenclip.theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
        else if (t === 'dark') document.documentElement.classList.add('dark');
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.classList.remove('dark');
      })();
    </script>
