<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="rec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Screen/monitor shape -->
  <rect x="96" y="96" width="320" height="220" rx="20" fill="#1e1b4b" opacity="0.6"/>
  <rect x="112" y="112" width="288" height="188" rx="12" fill="#0f172a"/>
  <!-- Monitor stand -->
  <rect x="216" y="316" width="80" height="24" rx="4" fill="#1e1b4b" opacity="0.6"/>
  <rect x="186" y="340" width="140" height="12" rx="6" fill="#1e1b4b" opacity="0.6"/>
  <!-- Record button (red circle) -->
  <circle cx="256" cy="206" r="48" fill="url(#rec)"/>
  <!-- Play triangle inside circle -->
  <polygon points="244,182 244,230 280,206" fill="white" opacity="0.95"/>
  <!-- Scissors/trim icon bottom right -->
  <g transform="translate(360, 380) scale(0.6)">
    <line x1="20" y1="20" x2="100" y2="100" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <line x1="100" y1="20" x2="20" y2="100" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <circle cx="20" cy="20" r="18" fill="none" stroke="white" stroke-width="8" opacity="0.7"/>
    <circle cx="20" cy="100" r="18" fill="none" stroke="white" stroke-width="8" opacity="0.7"/>
  </g>
</svg>
